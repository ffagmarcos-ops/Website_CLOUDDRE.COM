services:
  clouddre-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: clouddre/site:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.services.clouddre-site.loadbalancer.server.port=80"

      # HTTPS router (clouddre.com + www)
      - "traefik.http.routers.clouddre-site.rule=Host(`clouddre.com`) || Host(`www.clouddre.com`)"
      - "traefik.http.routers.clouddre-site.entrypoints=websecure"
      - "traefik.http.routers.clouddre-site.priority=100"
      - "traefik.http.routers.clouddre-site.tls.certresolver=myresolver"
      - "traefik.http.routers.clouddre-site.service=clouddre-site"
      - "traefik.http.routers.clouddre-site.middlewares=clouddre-www-redirect@docker,clouddre-compress@docker,clouddre-sec-headers@docker"

      # HTTP -> HTTPS redirect
      - "traefik.http.routers.clouddre-site-http.rule=Host(`clouddre.com`) || Host(`www.clouddre.com`)"
      - "traefik.http.routers.clouddre-site-http.entrypoints=web"
      - "traefik.http.routers.clouddre-site-http.priority=100"
      - "traefik.http.routers.clouddre-site-http.middlewares=clouddre-https-redirect@docker"

      # Middlewares
      - "traefik.http.middlewares.clouddre-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.clouddre-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.clouddre-www-redirect.redirectregex.regex=^https?://www\\.clouddre\\.com/(.*)"
      - "traefik.http.middlewares.clouddre-www-redirect.redirectregex.replacement=https://clouddre.com/$${1}"
      - "traefik.http.middlewares.clouddre-www-redirect.redirectregex.permanent=true"
      - "traefik.http.middlewares.clouddre-compress.compress=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.clouddre-sec-headers.headers.frameDeny=true"
    networks:
      - traefik

networks:
  traefik:
    external: true
